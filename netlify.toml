# Netlify — Muneeb Ghazi Services
# Frontend lives in web/ (separate agent owns it); functions in netlify/functions/.

[build]
  base = "."
  command = "cd web && npm install && npm run build"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: everything that is not a file or a function goes to index.html.
# The /.netlify/* exclusion keeps function + internal routes working.
[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Install each function's own dependencies (netlify/functions/package.json)
# so the API function can resolve @supabase/supabase-js at build time.
[[plugins]]
  package = "@netlify/plugin-functions-install-core"




